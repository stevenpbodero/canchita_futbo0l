<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>PlayZone - Registro</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-image">

  <div class="auth-card glass">
    <h2>Crear cuenta</h2>

    <form onsubmit="register(event)" class="form">
      <input id="regUser" type="text" placeholder="Usuario">
      <input id="regEmail" type="email" placeholder="Correo (opcional)">
      <input id="regPass" type="password" placeholder="Contraseña">
      <button type="submit">Registrar</button>
    </form>

    <p class="small">¿Ya tienes cuenta? <a href="index.html">Iniciar sesión</a></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
