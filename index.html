<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>PlayZone - Login</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-image">

  <div class="auth-card glass">
    <h2>PlayZone</h2>

    <form onsubmit="login(event)" class="form">
      <input id="loginUser" type="text" placeholder="Usuario (ej: admin)" autocomplete="username">
      <input id="loginPass" type="password" placeholder="Contraseña" autocomplete="current-password">
      <button type="submit">Ingresar</button>
    </form>

    <p class="small">¿No tienes cuenta? <a href="register.html">Registrarse</a></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
