<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Horas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Administrador</h2>
                <button class="menu-toggle">☰</button>
            </div>
            <nav class="sidebar-nav">
                <a href="admin.html" class="nav-item">
                    <span class="icon">🏠</span> Volver
                </a>
                <a href="admin-horas.html" class="nav-item active">
                    <span class="icon">⏰</span> Horas
                </a>
            </nav>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <button class="btn-logout" onclick="location.href='index.html'">Cerrar Sesión</button>
            </header>

            <div class="admin-content">
                <h1 class="page-title">Agregar Horas</h1>
                
                <div class="form-cancha-container">
                    <form id="formHoras" class="form-admin">
                        <div class="form-row">
                            <div class="form-group">
                                <label>Estado de la hora †</label>
                                <select required>
                                    <option value="">Disponible</option>
                                    <option value="disponible">Disponible</option>
                                    <option value="reservada">Reservada</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Selecciona una cancha *</label>
                                <input type="date" value="2017-11-23" required>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Hora De Inicio †</label>
                                <select required>
                                    <option value="">Seleccionar</option>
                                    <option value="09:00">09:00</option>
                                    <option value="10:00">10:00</option>
                                    <option value="11:00">11:00</option>
                                    <option value="12:00">12:00</option>
                                    <option value="13:00">13:00</option>
                                    <option value="14:00">14:00</option>
                                    <option value="15:00">15:00</option>
                                    <option value="16:00">16:00</option>
                                    <option value="17:00">17:00</option>
                                    <option value="18:00">18:00</option>
                                    <option value="19:00">19:00</option>
                                    <option value="20:00">20:00</option>
                                    <option value="21:00">21:00</option>
                                    <option value="22:00">22:00</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Hora De Fin †</label>
                                <select required>
                                    <option value="">Seleccionar</option>
                                    <option value="10:00">10:00</option>
                                    <option value="11:00">11:00</option>
                                    <option value="12:00">12:00</option>
                                    <option value="13:00">13:00</option>
                                    <option value="14:00">14:00</option>
                                    <option value="15:00">15:00</option>
                                    <option value="16:00">16:00</option>
                                    <option value="17:00">17:00</option>
                                    <option value="18:00">18:00</option>
                                    <option value="19:00">19:00</option>
                                    <option value="20:00">20:00</option>
                                    <option value="21:00">21:00</option>
                                    <option value="22:00">22:00</option>
                                    <option value="23:00">23:00</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Selecciona la cancha a agregar la hora †</label>
                                <select required>
                                    <option value="">Seleccionar</option>
                                    <option value="cancha1">cancha futbol 1</option>
                                    <option value="cancha2">cancha futbol 2</option>
                                </select>
                            </div>
                        </div>

                        <button type="submit" class="btn-agregar">Agregar</button>
                    </form>

                    <div class="cancha-illustration">
                        <div class="stopwatch-icon">⏱️</div>
                    </div>
                </div>

                <footer class="admin-footer">
                    <p>Todos los derechos reservados © 2017.</p>
                    <button class="btn-xi">Medellín, XVI</button>
                </footer>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
