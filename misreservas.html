<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Reservas - Fútbol</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">FÚTBOL</div>
        <ul class="nav-menu">
            <li><a href="index.html">HOME</a></li>
            <li><a href="misreservas.html">RESERVAS</a></li>
            <li><a href="#">LISTADO RESERVAS</a></li>
            <li><a href="#">ACTUALIZAR PERFIL</a></li>
            <li><a href="index.html">CERRAR SESIÓN</a></li>
        </ul>
    </nav>

    <section class="hero">
        <div class="reservas-container">
            <h1>MIS RESERVAS</h1>
            <button class="btn-buscar">Buscar</button>
            
            <div class="buscar-section">
                <label>Indice: </label>
                <input type="text" placeholder="Buscar...">
                <label>Siguiente</label>
            </div>

            <table class="reservas-table">
                <thead>
                    <tr>
                        <th>Indice(i)</th>
                        <th>Tipo de cancha</th>
                        <th>Nombre de cancha</th>
                        <th>Fecha</th>
                        <th>Hora de inicio</th>
                        <th>Hora de fin</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="reservasBody">
                    <!-- Reservas se cargan dinámicamente -->
                </tbody>
            </table>
            
            <div class="pagination">
                <button class="btn-nav">Anterior</button>
                <button class="btn-nav">Siguiente</button>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
    <script>
        loadReservas();
    </script>
</body>
</html>
